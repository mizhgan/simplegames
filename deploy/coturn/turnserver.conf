# coturn — свой TURN-сервер для игры по сети (SimpleGames).
# Установка (Ubuntu/Debian):  apt install coturn
# Скопируйте файл в /etc/turnserver.conf, замените значения с пометкой ЗАМЕНИТЬ
# и запустите:  systemctl enable --now coturn
# Затем пропишите сервер в блоке CONFIG в начале sg/js/net.js (см. README).

listening-port=3478

# Внешний IP-адрес сервера (ЗАМЕНИТЬ)
external-ip=203.0.113.10

# Диапазон UDP-портов для пересылки трафика — откройте его в файрволе вместе с 3478/udp и 3478/tcp
min-port=49160
max-port=49250

# Логин и пароль. Они будут видны в коде сайта — это нормально для TURN,
# ниже стоят ограничения, чтобы сервер нельзя было использовать во вред. (ЗАМЕНИТЬ)
lt-cred-mech
user=simplegames:ЗАМЕНИТЬ_на_длинный_пароль
realm=example.com

fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1

# Ограничения: игра по сети передаёт крошечные сообщения, много трафика ей не нужно
total-quota=100
user-quota=20
max-bps=64000
stale-nonce=600

# Запрещаем пересылку во внутренние сети — чтобы через TURN нельзя было попасть на сам сервер и его соседей
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
