<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}} — SimpleGames</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#0d0e1a">
  <link rel="icon" href="../../sg/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../../sg/img/icon-180.png">
  <link rel="stylesheet" href="../../sg/css/style.css">
{{head}}  <script>try{var t=localStorage.getItem('sg-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="../../index.html">
        <img class="logo-mark" src="../../sg/img/favicon.svg" alt="">
        <span>Simple<b>Games</b></span>
      </a>
      <div class="header-nav">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Сменить тему"></button>
      </div>
    </div>
  </header>

  <main class="container game-page">
    <a class="back-link" href="../../index.html">← Все игры</a>
    <div class="game-head">
      <h1>{{title}}</h1>
{{stats}}    </div>

    <div class="game-layout">
      <div class="game-stage">
{{stage}}
      </div>

      <aside>
        <div class="info-card">
          <h2>Как играть</h2>
          <ul>
{{rules}}
          </ul>
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span data-year></span> SimpleGames</span>
      <a href="../../index.html">Все игры</a>
    </div>
  </footer>

{{scripts}}</body>
</html>
