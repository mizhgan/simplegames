<div class="game-controls">
  <div class="seg" id="size" role="group" aria-label="Размер поля">
    <button type="button" data-value="5">5 × 5</button>
    <button type="button" data-value="6">6 × 6</button>
    <button type="button" data-value="7">7 × 7</button>
    <button type="button" data-value="8">8 × 8</button>
  </div>
  <button class="btn btn-primary" type="button" id="new-btn">Новое поле</button>
  <button class="btn btn-ghost" type="button" id="hint-btn">💡 Подсказка</button>
</div>
<div class="fw-current" id="current" aria-live="polite"></div>
<div class="stage-wrap fw-wrap">
  <div class="fw-board" id="board" aria-label="Поле с буквами"></div>
  <div class="overlay" id="overlay" hidden>
    <h2>Все слова найдены! 🎉</h2>
    <p id="overlay-text"></p>
    <div class="overlay-actions">
      <button class="btn btn-primary" type="button" id="again-btn">Новое поле</button>
    </div>
  </div>
</div>
<ul class="fw-words" id="words" aria-label="Слова"></ul>
