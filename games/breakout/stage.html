<div class="stage-wrap" style="max-width:600px">
  <canvas id="board" class="board-canvas" style="aspect-ratio:6/5" aria-label="Игровое поле арканоида"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="overlay-title">Арканоид</h2>
    <p id="overlay-text">Отбивайте мяч платформой и разбейте все кирпичи.</p>
    <div class="overlay-actions">
      <button class="btn btn-primary" type="button" id="start-btn">Играть</button>
    </div>
  </div>
</div>
<div class="game-controls">
  <button class="btn btn-ghost" type="button" id="pause-btn">Пауза</button>
  <button class="btn btn-ghost" type="button" id="restart-btn">Заново</button>
</div>
