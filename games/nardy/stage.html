<div class="game-controls">
  <div class="seg" id="mode" role="group" aria-label="Режим">
    <button type="button" data-value="ai">Против компьютера</button>
  </div>
</div>
<div class="nd-dice" id="dice" aria-live="polite"></div>
<div class="status-line" id="status" aria-live="polite"></div>
<div class="nd-wrap">
  <div class="nd-frame">
    <div class="nd-board" id="board" aria-label="Доска для нард"></div>
    <div class="nd-side">
      <div class="nd-ai-off" title="Компьютер выбросил">⚫<br><b id="off-ai">0</b></div>
      <button class="nd-tray" type="button" id="off-tray" aria-label="Выбросить шашку" title="Выбросить шашку"><span>⚪ ⇥</span><b id="off-me">0</b></button>
    </div>
  </div>
</div>
<div class="game-controls">
  <button class="btn btn-primary" type="button" id="roll-btn">🎲 Бросить кости</button>
  <button class="btn btn-ghost" type="button" id="undo-btn" disabled>↶ Переходить</button>
  <button class="btn btn-ghost" type="button" id="new-btn">Новая партия</button>
</div>
