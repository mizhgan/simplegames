<div class="game-controls">
  <div class="seg" id="mode" role="group" aria-label="Режим">
    <button type="button" data-value="ai">Против компьютера</button>
  </div>
  <div class="seg" id="difficulty" role="group" aria-label="Сложность">
    <button type="button" data-value="easy">Легко</button>
    <button type="button" data-value="normal">Средне</button>
    <button type="button" data-value="hard">Сложно</button>
  </div>
</div>

<div class="status-line" id="status" aria-live="polite"></div>

<div class="wr-bar">
  <div class="wr-side"><p>Вы</p><b id="my-count">0</b></div>
  <div class="wr-time" id="time">3:00</div>
  <div class="wr-side"><p id="opp-label">Компьютер</p><b id="opp-count">0</b></div>
</div>

<div class="ws-tiles" id="tiles" aria-label="Буквы"></div>
<div class="ws-input" id="input" aria-live="polite">&nbsp;</div>
<div class="game-controls">
  <button class="btn btn-primary" type="button" id="submit-btn">Проверить</button>
  <button class="btn btn-ghost" type="button" id="back-btn">⌫</button>
  <button class="btn btn-ghost" type="button" id="shuffle-btn">🔀</button>
</div>
<div class="ws-found" id="found"></div>

<div class="game-controls">
  <button class="btn btn-ghost" type="button" id="stop-btn">Закончить раньше</button>
  <button class="btn btn-primary" type="button" id="new-btn">Новое слово</button>
</div>
