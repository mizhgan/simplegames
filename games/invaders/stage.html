<div class="stage-wrap" style="max-width:480px">
  <canvas id="board" class="board-canvas" style="aspect-ratio:6/7" aria-label="Игровое поле"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="overlay-title">Космические захватчики</h2>
    <p id="overlay-text">Защитите Землю от волн пришельцев!</p>
    <div class="overlay-actions">
      <button class="btn btn-primary" type="button" id="start-btn">Играть</button>
    </div>
  </div>
</div>
<div class="touch-keys" id="touch">
  <button type="button" data-key="ArrowLeft" aria-label="Влево">◀</button>
  <button type="button" data-key="Space" class="wide" aria-label="Огонь">🔥</button>
  <button type="button" data-key="ArrowRight" aria-label="Вправо">▶</button>
</div>
<div class="game-controls">
  <button class="btn btn-ghost" type="button" id="pause-btn">Пауза</button>
</div>
