<div class="game-controls">
  <div class="seg" id="size" role="group" aria-label="Размер поля">
    <button type="button" data-value="5">5×5</button>
    <button type="button" data-value="7">7×7</button>
    <button type="button" data-value="9">9×9</button>
  </div>
</div>
<div class="status-line" id="status" aria-live="polite"></div>
<div class="stage-wrap">
  <div class="pp-board" id="board" aria-label="Поле с трубами"></div>
  <div class="overlay" id="overlay" hidden>
    <h2>Водопровод готов! 🎉</h2>
    <p id="overlay-text"></p>
    <div class="overlay-actions">
      <button class="btn btn-primary" type="button" id="again-btn">Следующий уровень</button>
    </div>
  </div>
</div>
<div class="game-controls">
  <button class="btn btn-primary" type="button" id="new-btn">Новый уровень</button>
</div>
