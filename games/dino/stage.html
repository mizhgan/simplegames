<div class="stage-wrap" style="max-width:720px">
  <canvas id="board" class="board-canvas" style="aspect-ratio:600/220" aria-label="Игровое поле"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="overlay-title">Динозаврик</h2>
    <p id="overlay-text">Пробел или касание — прыжок, стрелка вниз — пригнуться.</p>
    <div class="overlay-actions">
      <button class="btn btn-primary" type="button" id="start-btn">Бежать</button>
    </div>
  </div>
</div>
<div class="dino-pad">
  <button type="button" id="duck-btn">▼ Пригнуться</button>
  <button type="button" id="jump-btn">▲ Прыжок</button>
</div>
