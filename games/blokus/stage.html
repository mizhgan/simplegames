<div class="game-controls">
  <div class="seg" id="mode" role="group" aria-label="Режим">
    <button type="button" data-value="ai">Против компьютера</button>
    <button type="button" data-value="pvp">Вдвоём</button>
  </div>
  <div class="seg" id="difficulty" role="group" aria-label="Сложность">
    <button type="button" data-value="easy">Легко</button>
    <button type="button" data-value="normal">Средне</button>
    <button type="button" data-value="hard">Сложно</button>
  </div>
</div>

<div class="status-line" id="status" aria-live="polite"></div>

<div class="stage-wrap bk-wrap">
  <div class="bk-side"><h3><span>Оранжевые</span><span>очки: <b class="bk-score"></b></span></h3><div class="bk-tray" id="tray-1"></div></div>
  <div class="bk-board" id="board" role="grid" aria-label="Поле 14 на 14"></div>
  <div class="bk-tools"><button class="btn btn-ghost" type="button" id="rot-btn">⟳ Повернуть</button><button class="btn btn-ghost" type="button" id="flip-btn">⇋ Отразить</button><button class="btn btn-primary" type="button" id="pass-btn" hidden>Пас</button></div>
  <div class="bk-side"><h3><span>Синие</span><span>очки: <b class="bk-score"></b></span></h3><div class="bk-tray" id="tray-0"></div></div>
</div>

<div class="game-controls">
  <button class="btn btn-primary" type="button" id="new-btn">Новая партия</button>
  <button class="btn btn-ghost" type="button" id="undo-btn">Отменить ход</button>
</div>
