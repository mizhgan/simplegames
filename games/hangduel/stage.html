<div class="game-controls">
  <div class="seg" id="mode" role="group" aria-label="Режим">
    <button type="button" data-value="ai">Против компьютера</button>
  </div>
  <div class="seg" id="difficulty" role="group" aria-label="Сложность">
    <button type="button" data-value="easy">Легко</button>
    <button type="button" data-value="normal">Средне</button>
    <button type="button" data-value="hard">Сложно</button>
  </div>
</div>
<div class="status-line" id="status" aria-live="polite"></div>
<div class="hd-wrap">
  <div class="hd-setup" id="setup">
    <input type="text" id="word-in" maxlength="12" autocomplete="off" placeholder="Слово для соперника" aria-label="Слово для соперника">
    <button class="btn btn-primary" type="button" id="word-btn">Загадать</button>
    <button class="btn btn-ghost" type="button" id="word-random">Случайное</button>
    <p class="hd-err" id="word-err"></p>
  </div>
  <div class="hd-cols">
    <div class="hd-main"><h3 id="my-title"></h3><svg class="hg-gallows" id="gallows" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" aria-hidden="true">
  <path d="M20 190 H120"/><path class="part" d="M50 190 V20"/><path class="part" d="M50 20 H140 M50 55 L85 20"/><path class="part" d="M140 20 V45"/>
  <circle class="part" cx="140" cy="62" r="17"/><path class="part" d="M140 79 V130"/><path class="part" d="M140 92 L115 115 M140 92 L165 115"/><path class="part" d="M140 130 L118 165 M140 130 L162 165"/>
</svg><div class="hg-word" id="word" aria-live="polite"></div></div>
    <div class="hd-opp"><h3 id="opp-title"></h3><svg class="hg-gallows" id="opp-gallows" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" aria-hidden="true">
  <path d="M20 190 H120"/><path class="part" d="M50 190 V20"/><path class="part" d="M50 20 H140 M50 55 L85 20"/><path class="part" d="M140 20 V45"/>
  <circle class="part" cx="140" cy="62" r="17"/><path class="part" d="M140 79 V130"/><path class="part" d="M140 92 L115 115 M140 92 L165 115"/><path class="part" d="M140 130 L118 165 M140 130 L162 165"/>
</svg><div class="hd-oppword" id="opp-word"></div></div>
  </div>
  <div class="hg-keyboard" id="keyboard" aria-label="Буквы"></div>
</div>
<div class="game-controls"><button class="btn btn-primary" type="button" id="new-btn">Новая партия</button></div>
