<div class="bj">
  <div class="bj-label"><span>Дилер</span><b id="dealer-total"></b></div>
  <div class="bj-hand" id="dealer" aria-label="Карты дилера"></div>
  <div class="bj-rule">Блэкджек платит 3:2 · дилер останавливается на 17</div>
  <div class="bj-hand" id="player" aria-label="Ваши карты"></div>
  <div class="bj-label"><span>Вы</span><b id="player-total"></b></div>
</div>
<div class="status-line" id="status" aria-live="polite"></div>
<div class="game-controls">
  <div class="seg" id="bet" role="group" aria-label="Ставка">
    <button type="button" data-value="10">10</button>
    <button type="button" data-value="25">25</button>
    <button type="button" data-value="50">50</button>
    <button type="button" data-value="100">100</button>
  </div>
  <button class="btn btn-primary" type="button" id="deal-btn">Раздать</button>
  <button class="btn btn-primary" type="button" id="hit-btn" hidden>Ещё</button>
  <button class="btn btn-ghost" type="button" id="stand-btn" hidden>Хватит</button>
  <button class="btn btn-ghost" type="button" id="double-btn" hidden>Удвоить</button>
</div>
