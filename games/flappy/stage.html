<div class="stage-wrap" style="max-width:400px">
  <canvas id="board" class="board-canvas" style="aspect-ratio:2/3" aria-label="Игровое поле"></canvas>
  <div class="overlay" id="overlay" style="background:color-mix(in srgb, var(--bg) 45%, transparent)">
    <h2 id="overlay-title">Птичка</h2>
    <p id="overlay-text">Нажмите пробел, кликните или коснитесь поля, чтобы взлететь.</p>
    <div class="overlay-actions">
      <button class="btn btn-primary" type="button" id="start-btn">Начать</button>
    </div>
  </div>
</div>
