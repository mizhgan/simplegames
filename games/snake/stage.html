<div class="stage-wrap">
  <canvas id="board" class="board-canvas" style="aspect-ratio:1" aria-label="Игровое поле змейки"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="overlay-title">Змейка</h2>
    <p id="overlay-text">Собирайте яблоки и не врезайтесь в стены и в собственный хвост.</p>
    <div class="overlay-actions">
      <button class="btn btn-primary" type="button" id="start-btn">Играть</button>
    </div>
  </div>
</div>

<div class="game-controls">
  <div class="seg" id="speed" role="group" aria-label="Скорость">
    <button type="button" data-value="slow">Медленно</button>
    <button type="button" data-value="normal">Нормально</button>
    <button type="button" data-value="fast">Быстро</button>
  </div>
  <button class="btn btn-ghost" type="button" id="pause-btn">Пауза</button>
</div>

<div class="dpad" aria-label="Управление">
  <button type="button" data-dir="up" aria-label="Вверх">▲</button>
  <button type="button" data-dir="left" aria-label="Влево">◀</button>
  <button type="button" data-dir="right" aria-label="Вправо">▶</button>
  <button type="button" data-dir="down" aria-label="Вниз">▼</button>
</div>
