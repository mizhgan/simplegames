<div class="game-controls">
  <div class="seg" id="level" role="group" aria-label="Сложность">
    <button type="button" data-value="beginner">Новичок</button>
    <button type="button" data-value="intermediate">Любитель</button>
    <button type="button" data-value="expert">Профи</button>
  </div>
</div>

<div class="game-controls">
  <button class="btn btn-ghost ms-face" type="button" id="face" aria-label="Новая игра" title="Новая игра">🙂</button>
  <button class="btn btn-ghost" type="button" id="flag-mode" aria-pressed="false">🚩 Режим флажков</button>
</div>

<div class="ms-scroll">
  <div class="ms-board" id="board" aria-label="Минное поле"></div>
</div>

<div class="status-line" id="status" aria-live="polite"></div>
