<div class="game-controls">
  <div class="seg" id="size" role="group" aria-label="Размер поля">
    <button type="button" data-value="3">3 × 3</button>
    <button type="button" data-value="4">4 × 4</button>
    <button type="button" data-value="5">5 × 5</button>
  </div>
  <button class="btn btn-primary" type="button" id="new-btn">Перемешать</button>
</div>
<div class="stage-wrap ft-wrap">
  <div class="ft-board" id="board" aria-label="Поле пятнашек"></div>
  <div class="overlay" id="overlay" hidden>
    <h2>Собрано! 🎉</h2>
    <p id="overlay-text"></p>
    <div class="overlay-actions">
      <button class="btn btn-primary" type="button" id="again-btn">Сыграть ещё</button>
    </div>
  </div>
</div>
