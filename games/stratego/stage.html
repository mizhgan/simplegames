<div class="game-controls">
  <div class="seg" id="mode" role="group" aria-label="Режим">
    <button type="button" data-value="ai">Против компьютера</button>
    <button type="button" data-value="pvp">Вдвоём</button>
  </div>
  <div class="seg" id="difficulty" role="group" aria-label="Сложность">
    <button type="button" data-value="easy">Легко</button>
    <button type="button" data-value="normal">Средне</button>
    <button type="button" data-value="hard">Сложно</button>
  </div>
</div>

<div class="status-line" id="status" aria-live="polite"></div>

<div class="stage-wrap st-wrap">
  <div class="st-curtain" id="curtain" hidden><span>Передайте ход — соперник, отвернитесь!</span><button class="btn btn-primary" type="button">Показать мою армию</button></div>
  <div class="st-board" id="board" role="grid" aria-label="Поле 8 на 8"></div>
  <div class="st-bar" id="setup-bar" hidden><button class="btn btn-ghost" type="button" id="shuffle-btn">🔀 Перемешать</button><button class="btn btn-primary" type="button" id="ready-btn">Готово</button></div>
  <p class="st-battle" id="battle" aria-live="polite"></p>
  <div class="st-dead" id="dead"></div>
</div>

<div class="game-controls">
  <button class="btn btn-primary" type="button" id="new-btn">Новая партия</button>
</div>
