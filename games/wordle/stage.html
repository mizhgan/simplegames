<div class="game-controls">
  <div class="seg" id="mode" role="group" aria-label="Режим">
    <button type="button" data-value="daily">Слово дня</button>
    <button type="button" data-value="free">Свободная игра</button>
  </div>
  <button class="btn btn-ghost" type="button" id="stats-btn">📊 Статистика</button>
</div>
<div class="wd-wrap">
  <div class="wd-toast" id="toast" role="status" aria-live="polite"></div>
  <div class="wd-board" id="board" aria-label="Попытки"></div>
</div>
<div class="wd-keyboard" id="keyboard" aria-label="Клавиатура"></div>
<div class="wd-modal" id="overlay" hidden>
  <div class="wd-dialog" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
    <h2 id="overlay-title">Статистика</h2>
    <p class="wd-answer" id="overlay-word"></p>
    <div class="wd-stats">
      <div><b id="st-played">0</b><span>сыграно</span></div>
      <div><b id="st-winrate">0</b><span>% побед</span></div>
      <div><b id="st-streak">0</b><span>серия</span></div>
      <div><b id="st-max">0</b><span>лучшая серия</span></div>
    </div>
    <h3>Попыток до победы</h3>
    <div id="dist"></div>
    <p class="wd-countdown" id="countdown"></p>
    <div class="wd-actions">
      <button class="btn btn-primary" type="button" id="share-btn">Поделиться</button>
      <button class="btn btn-primary" type="button" id="next-btn">Новое слово</button>
      <button class="btn btn-ghost" type="button" id="close-btn">Закрыть</button>
    </div>
  </div>
</div>
