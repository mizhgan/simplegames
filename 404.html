<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — SimpleGames</title>
  <meta name="theme-color" content="#0d0e1a">
  <link rel="icon" href="/sg/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/sg/img/icon-180.png">
  <link rel="stylesheet" href="/sg/css/style.css">
  <script>try{var t=localStorage.getItem('sg-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/">
        <img class="logo-mark" src="/sg/img/favicon.svg" alt="">
        <span>Simple<b>Games</b></span>
      </a>
      <div class="header-nav">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Сменить тему"></button>
      </div>
    </div>
  </header>
  <main class="container not-found">
    <div class="code grad">404</div>
    <h1>Такой страницы нет</h1>
    <p style="color:var(--muted)">Возможно, она переехала — а может, её никогда и не было.</p>
    <p><a class="btn btn-primary" href="/">На главную</a></p>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span data-year></span> SimpleGames</span>
    </div>
  </footer>
  <script src="/sg/js/common.js"></script>
  <script src="/sg/js/site.js"></script>
</body>
</html>
